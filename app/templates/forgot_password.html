{% extends "login-base.html" %}

{% block content %}

<div class="card shadow-lg border-0 rounded-lg">
    <div class="card-header text-white text-center">
        <i class="bi bi-envelope-paper display-4 mb-3 d-block"></i>
        <h1 class="mb-2">Recuperar Contraseña</h1>
        <p class="small mb-0">Te enviaremos un enlace a tu correo para restablecerla</p>
    </div>
    <div class="card-body p-4">
        <form method="post" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group mb-4">
                <label for="email" class="form-label"><i class="bi bi-envelope"></i> Correo electrónico</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Ingresa tu correo registrado"
                    required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-send me-2"></i>Enviar enlace de recuperación
                </button>
            </div>
        </form>
        <hr class="my-4">
        <div class="text-center">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión
            </a>
        </div>
    </div>
</div>

{% endblock %}
