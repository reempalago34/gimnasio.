{% extends "login-base.html" %}

{% block content %}

<div class="card shadow-lg border-0 rounded-lg">
    <div class="card-header text-white text-center">
        <i class="bi bi-shield-lock display-4 mb-3 d-block"></i>
        <h1 class="mb-2">Nueva Contraseña</h1>
        <p class="small mb-0">Elige una nueva contraseña para tu cuenta</p>
    </div>
    <div class="card-body p-4">
        <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="form-group mb-3">
                <label for="password" class="form-label"><i class="bi bi-lock"></i> Nueva contraseña</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button class="btn toggle-password" type="button" data-target="password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group mb-4">
                <label for="confirmPassword" class="form-label"><i class="bi bi-lock-fill"></i> Confirmar contraseña</label>
                <div class="input-group">
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                        placeholder="Repite la contraseña" required minlength="6">
                    <button class="btn toggle-password" type="button" data-target="confirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle me-2"></i>Actualizar contraseña
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
